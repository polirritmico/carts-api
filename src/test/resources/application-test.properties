spring.application.name=CART-SERVICE-test

spring.datasource.url=jdbc:h2:mem:cartsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false

jwt.secret=clave-secreta-de-prueba-con-longitud-suficiente
jwt.issuer=login-service
jwt.public=/**,/api/v1/health,/v3/api-docs/**,/swagger-ui/**

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

eureka.client.enabled=false
